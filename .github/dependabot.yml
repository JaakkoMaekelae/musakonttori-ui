version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 8
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
    ignore:
      - dependency-name: "prisma"
        versions:
          - "8.x"
      - dependency-name: "@prisma/client"
        versions:
          - "8.x"
      - dependency-name: "@prisma/engines"
        versions:
          - "8.x"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
